<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boutique OM</title>
    <meta name="description" content="Boutique OM : maillots, entraînement et accessoires officiels. Commandez en ligne et retirez vos articles en boutique, sans paiement en ligne.">
    <meta name="theme-color" content="#0061ad">
    <link rel="icon" href="data:,">
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/src/global.css" />

    <!--
      Application du thème avant le premier affichage. Script ordinaire et non
      module : le navigateur l'exécute avant de dessiner la page, qui
      n'apparaît donc jamais, même brièvement, dans le mauvais thème.
      Le thème est conservé en localStorage : le serveur n'en a pas besoin.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "sombre") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        // localStorage indisponible : on reste en thème clair.
      }
    </script>
  </head>
  <body class="bg-om-surface text-om-texte antialiased ">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
