<li class="rounded-xl bg-om-fond p-3 md:p-4">
  <form data-role="formulaire" novalidate class="flex flex-col gap-3">
    <h2 class="text-sm font-semibold text-om-texte">Modifier les options de {{nom}}</h2>

    <div data-role="bloc-taille" class="flex flex-col gap-2">
      <label for="edition-taille" class="text-[11px] text-om-texte-doux">Taille</label>
      <select id="edition-taille" name="edition-taille" data-role="taille" class="w-full rounded-lg border border-om-bordure-champ bg-white px-4 py-3 text-[13px] text-om-texte"></select>
    </div>

    <div data-role="bloc-flocage" class="flex flex-col gap-3">
      <label class="flex items-center gap-2 text-[13px] text-om-texte">
        <input type="checkbox" data-role="flocage-actif">
        Flocage officiel · +{{prixFlocage}}
      </label>
      <div data-role="champs-flocage" hidden class="grid grid-cols-2 gap-3">
        <slot name="champ-nom"></slot>
        <slot name="champ-numero"></slot>
      </div>
    </div>

    <p role="alert" data-role="erreur" hidden class="rounded-lg bg-om-erreur-fond px-3.5 py-2.5 text-xs font-semibold text-om-erreur"></p>

    <div class="flex gap-3">
      <button type="submit" class="rounded-lg bg-om-bleu px-5 py-3 text-[13px] font-semibold text-white transition-colors hover:bg-om-bleu-fonce">Enregistrer</button>
      <button type="button" data-role="annuler" class="rounded-lg bg-om-fond-doux px-5 py-3 text-[13px] font-semibold text-om-bleu">Annuler</button>
    </div>
  </form>
</li>
