<section class="mx-auto max-w-admin-login rounded-admin-panel bg-white p-6 sm:p-8">
  <h1 class="text-admin-login-title font-bold">Espace administration</h1>
  <p class="mt-4 text-xs leading-tight text-om-texte-doux">Connexion séparée de celle des clients.</p>
  <form novalidate class="mt-4 flex flex-col gap-4">
    <slot name="fields"></slot>
    <button type="submit" class="rounded-lg bg-om-bleu px-6 py-3 text-[13px] leading-tight font-semibold text-white hover:bg-om-bleu-fonce disabled:cursor-wait disabled:opacity-65">{{button}}</button>
  </form>
</section>
