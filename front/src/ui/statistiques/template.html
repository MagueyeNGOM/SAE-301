<section>

  <p data-role="unavailable" hidden>Les indicateurs sont indisponibles. Rechargez la page pour réessayer.</p>
  <dl class="mt-6 grid gap-4 sm:grid-cols-2">
    <div class="rounded-xl bg-om-fond p-6">
      <dt class="text-xs text-om-texte-doux">Produits</dt>
      <dd class="mt-2 text-[32px] font-bold">{{total}}</dd>
    </div>
    <div class="rounded-xl bg-om-fond p-6">
      <dt class="text-xs text-om-texte-doux">Commandes</dt>
      <dd class="mt-2 text-[32px] font-bold">{{orders}}</dd>
    </div>
  </dl>
</section>
