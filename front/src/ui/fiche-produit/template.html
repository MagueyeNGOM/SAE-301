<article class="grid gap-6 md:grid-cols-2 md:gap-10">
  <div class="flex flex-col gap-3">
    <img data-role="principale" class="aspect-square w-full rounded-lg bg-white object-contain" src="{{image}}" alt="{{nom}}" width="600" height="600">
    <ul data-role="vignettes" class="flex gap-2"></ul>
  </div>

  <div class="flex flex-col gap-4">
    <p class="text-xs font-medium tracking-wide text-om-texte-doux uppercase">{{categorie}}</p>
    <div class="flex items-start justify-between gap-4">
      <h1 class="text-2xl font-bold tracking-tight text-om-texte">{{nom}}</h1>
      <p class="shrink-0 text-2xl font-bold text-om-bleu">{{prix}}</p>
    </div>
    <div><slot name="stock"></slot></div>

    <section data-role="bloc-tailles" aria-labelledby="titre-tailles" class="flex flex-col gap-3">
      <h2 id="titre-tailles" class="text-sm font-semibold text-om-texte">Taille</h2>
      <ul data-role="tailles" class="grid grid-cols-3 gap-2 sm:grid-cols-6"></ul>
    </section>

    <section data-role="flocage" aria-labelledby="titre-flocage" class="flex flex-col gap-3 rounded-xl bg-om-fond p-4">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h2 id="titre-flocage" class="text-sm font-semibold text-om-texte">Flocage officiel</h2>
          <p class="text-[11px] text-om-texte-doux">Nom et numéro · +{{prixFlocage}}</p>
        </div>
        <button type="button" role="switch" aria-checked="false" aria-labelledby="titre-flocage" data-role="interrupteur" class="group relative h-6 w-11 shrink-0 rounded-full bg-om-bordure-champ transition-colors aria-checked:bg-om-bleu">
          <span class="absolute top-[3px] left-[3px] size-[18px] rounded-full bg-white transition-[left] group-aria-checked:left-[23px]"></span>
        </button>
      </div>
      <div data-role="champs-flocage" hidden class="flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-3">
          <slot name="champ-nom"></slot>
          <slot name="champ-numero"></slot>
        </div>
        <p class="rounded-lg bg-white px-3.5 py-2.5 text-xs text-om-texte-doux">Aperçu <strong data-role="apercu" class="ml-2 text-sm text-om-texte"></strong></p>
      </div>
    </section>

    <p role="alert" data-role="erreur" hidden class="rounded-lg bg-om-erreur-fond px-3.5 py-2.5 text-xs font-semibold text-om-erreur"></p>

    <p class="text-om-texte">{{description}}</p>
    <p class="text-sm text-om-texte-doux">{{details}}</p>
  </div>
</article>

<div class="sticky bottom-0 z-10 mt-6 -mx-4 flex items-center justify-between gap-4 bg-om-fond px-4 py-3 md:-mx-6 md:px-6 md:py-[18px]">
  <div class="hidden min-w-0 items-center gap-[14px] md:flex">
    <img class="size-14 shrink-0 rounded-md bg-white object-contain" src="{{image}}" alt="" width="56" height="56">
    <div class="min-w-0">
      <p class="text-sm font-semibold text-om-texte">{{nom}}</p>
      <p data-role="options" class="text-xs text-om-texte-doux"></p>
    </div>
  </div>
  <div class="flex flex-1 items-center justify-between gap-4 md:flex-none md:gap-6">
    <div>
      <p class="text-[11px] text-om-texte-doux">Prix avec options</p>
      <p data-role="prix-total" class="text-xl font-bold text-om-texte md:text-2xl">{{prix}}</p>
    </div>
    <button type="button" data-role="ajouter" class="rounded-lg bg-om-bleu px-5 py-3 text-[13px] font-semibold text-white transition-colors hover:bg-om-bleu-fonce md:px-6">Ajouter au panier</button>
  </div>
</div>
