<li class="flex flex-wrap items-center gap-x-4 gap-y-3 rounded-lg bg-white p-3.5 shadow-xs">
  <img class="size-20 rounded-md bg-om-fond object-contain" src="{{image}}" alt="{{nom}}" width="80" height="80" loading="lazy">

  <div class="flex min-w-40 flex-1 flex-col gap-1">
    <a href="/produit/{{slug}}" data-link class="text-[0.9375rem] leading-snug font-semibold text-om-texte hover:underline">{{nom}}</a>
    <p class="text-sm text-om-texte-doux">{{prix}}</p>
  </div>

  <div class="flex items-center gap-2">
    <label for="quantite-{{slug}}" class="text-sm text-om-texte-doux">Quantité</label>
    <input id="quantite-{{slug}}" data-role="quantite" type="number" inputmode="numeric" min="1" max="{{max}}" value="{{quantite}}" class="w-16 rounded-md border border-om-texte-doux/40 bg-white px-2 py-1.5 text-center text-om-texte">
  </div>

  <p class="w-24 text-right text-base font-bold text-om-bleu">{{sousTotal}}</p>

  <button type="button" data-role="supprimer" class="text-sm font-medium text-om-texte-doux underline underline-offset-4 transition-colors hover:text-om-texte">Supprimer<span class="sr-only"> {{nom}} du panier</span></button>
</li>
