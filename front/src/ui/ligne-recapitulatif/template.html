<li class="flex gap-4 rounded-xl bg-om-fond p-3">
  <img class="h-[72px] w-16 shrink-0 rounded-[10px] bg-white object-cover" src="{{image}}" alt="{{nom}}" width="64" height="72" loading="lazy">
  <div class="flex min-w-0 flex-1 flex-col items-start gap-2">
    <p class="text-[13px] font-semibold text-om-texte">{{nom}}</p>
    <p class="text-xs text-om-texte-doux">Quantité : {{quantite}}</p>
  </div>
  <p class="shrink-0 text-[13px] font-semibold text-om-texte">{{sousTotal}}</p>
</li>
