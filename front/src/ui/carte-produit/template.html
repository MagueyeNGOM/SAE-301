<a href="/produit/{{slug}}" data-link class="flex flex-col overflow-hidden rounded-lg bg-white shadow-xs transition-shadow hover:shadow-md">
  <img class="aspect-square w-full bg-om-fond object-contain" src="{{image}}" alt="{{nom}}" width="400" height="400" loading="lazy">

  <div class="flex flex-1 flex-col gap-1 p-3.5">
    <p class="text-xs font-medium tracking-wide text-om-texte-doux uppercase">{{categorie}}</p>
    <h2 class="text-[0.9375rem] leading-snug font-semibold text-om-texte">{{nom}}</h2>
    <div class="mt-auto flex items-center justify-between gap-2 pt-2">
      <p class="text-base font-bold text-om-bleu">{{prix}}</p>
      <slot name="stock"></slot>
    </div>
  </div>
</a>
