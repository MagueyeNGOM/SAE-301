<section aria-labelledby="categories-title" class="flex flex-col gap-category-section [&_h2]:tracking-normal [&_h2]:normal-case">
  <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
    <h1 id="categories-title" class="text-admin-title font-bold">Catégories</h1>
    <button type="button" data-action="add" class="rounded-lg bg-om-bleu px-6 py-3 text-[13px] font-semibold text-white hover:bg-om-bleu-moyen disabled:opacity-65">Ajouter une catégorie</button>
  </div>
  <p role="status" data-role="success" class="rounded-lg bg-om-succes-fond px-3.5 py-2.5 text-xs text-om-succes" hidden></p>
  <div data-role="load-error" hidden>
    <p role="alert" tabindex="-1" class="text-sm text-om-erreur"></p>
    <button type="button" data-action="retry" class="mt-3 text-sm text-om-bleu underline">Réessayer</button>
  </div>
  <div data-role="body" class="grid items-start gap-7 lg:grid-cols-[minmax(0,1fr)_25rem]">
    <div>
      <ul data-role="list" aria-label="Catégories du catalogue" class="flex flex-col gap-3"></ul>
      <p data-role="empty" class="text-sm text-om-texte-doux" hidden>Aucune catégorie. Ajoutez la première catégorie.</p>
    </div>
    <form novalidate aria-labelledby="category-form-title" class="flex min-w-0 flex-col gap-3.5 rounded-admin-panel bg-om-fond p-6">
      <h2 id="category-form-title" class="text-[15px] font-semibold [font-family:inherit]">Nouvelle catégorie</h2>
      <slot name="name"></slot>
      <slot name="description"></slot>
      <p role="alert" data-role="form-error" tabindex="-1" class="rounded-lg bg-om-erreur-fond px-3.5 py-2.5 text-xs font-semibold text-om-erreur" hidden></p>
      <div class="flex flex-wrap gap-2.5">
        <button type="submit" class="rounded-lg bg-om-bleu px-6 py-3 text-[13px] font-semibold text-white hover:bg-om-bleu-moyen disabled:opacity-65">Enregistrer</button>
        <button type="button" data-action="cancel-edit" class="rounded-lg bg-om-fond-doux px-6 py-3 text-[13px] font-semibold text-om-bleu disabled:opacity-65">Annuler</button>
      </div>
    </form>
  </div>
  <section data-role="confirmation" aria-labelledby="category-delete-title" tabindex="-1" class="flex flex-col gap-3 rounded-xl bg-om-erreur-fond p-category-section text-om-erreur" hidden>
    <h2 id="category-delete-title" class="text-sm font-semibold [font-family:inherit]"></h2>
    <p class="max-w-xl text-xs">La suppression est bloquée tant que des produits sont rattachés à la catégorie. Aucun produit ne sera supprimé.</p>
    <p role="alert" data-role="delete-error" tabindex="-1" class="text-xs font-semibold" hidden></p>
    <div class="flex flex-wrap gap-2.5">
      <button type="button" data-action="confirm-delete" class="rounded-lg px-6 py-3 text-[13px] font-semibold hover:underline disabled:opacity-65">Confirmer la suppression</button>
      <button type="button" data-action="cancel-delete" class="rounded-lg bg-om-fond-doux px-6 py-3 text-[13px] font-semibold text-om-bleu disabled:opacity-65">Annuler</button>
    </div>
  </section>
</section>
